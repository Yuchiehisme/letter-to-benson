<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Letter to Benson</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #f3f8ff;

    color: #222;

    font-family: Georgia, "Times New Roman", serif;

    overflow-x: hidden;

}



.container {

    width: 90%;

    max-width: 600px;

    text-align: center;

    animation: fadeIn 1.2s ease;

}



h1 {

    font-size: clamp(32px, 8vw, 48px);

    font-weight: normal;

    line-height: 1.3;

    margin: 0;

}



.subtitle {

    margin-top: 25px;

    color: #777;

    font-size: clamp(15px, 3vw, 20px);

}



.open {

    display: inline-block;

    max-width: 90%;

    margin-top: 55px;

    text-decoration: none;

    color: #222;

    font-size: clamp(17px, 4vw, 22px);

    line-height: 1.6;

    padding-bottom: 12px;

    border-bottom: 1px solid #999;

    transition: 0.3s;

    overflow-wrap: break-word;

    word-break: break-word;

}



.open:hover {

    letter-spacing: 1px;

    border-color: #222;

}



@keyframes fadeIn {


    from {

        opacity:0;

        transform:translateY(25px);

    }


    to {

        opacity:1;

        transform:translateY(0);

    }

}




@media(max-width:600px){


    body {

        padding:20px;

    }


    .container {

        width:100%;

    }


    h1 {

        font-size:34px;

        line-height:1.25;

    }


    .subtitle {

        font-size:16px;

        margin-top:20px;

    }


    .open {

        margin-top:45px;

        font-size:17px;

        line-height:1.7;

        padding-bottom:10px;

        max-width:100%;

    }


}

</style>


</head>


<body>


<div class="container">


<h1>
A Letter to Benson
</h1>


<div class="subtitle">
Summer 2026
</div>



<a class="open" href="letter.html">
Open if you're a fan of Jayson Tatum over Stephen Curry
</a>


</div>


</body>


</html>
